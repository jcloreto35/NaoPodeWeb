<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Não Pode!</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TELA INICIAL
        ========================= */

        #home {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-logo {
            display: block;
            object-fit: contain;
        }

        .brand-logo-home {
            width: min(82vw, 340px);
            max-height: 32vh;
            margin-bottom: 10px;
        }

        .config-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-compact {
            width: 48px;
            height: 42px;
        }

        .brand-logo-game {
            width: 58px;
            height: 42px;
            flex: 0 0 auto;
        }

        .brand-logo-result {
            width: min(45vw, 170px);
            max-height: 20vh;
            margin: 0 auto 8px;
        }

        .game-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
        }

        .main-button {
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }

        .main-button:active {
            transform: scale(.97);
        }

        /* =========================
           CONFIGURAÇÃO
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
        }

        .back-button {
            background: transparent;
            color: white;
            font-size: 28px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* TEMAS */

        .themes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme {
            padding: 16px 10px;
            border-radius: 12px;
            background: #1f2937;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid transparent;
        }

        .theme.selected {
            border-color: #ef4444;
            background: #2b1b1b;
        }

        /* TIMES */

        .team-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1f2937;
            border-radius: 14px;
            padding: 10px 15px;
        }

        .team-control button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #374151;
            color: white;
            font-size: 25px;
        }

        .team-number {
            font-size: 25px;
            font-weight: bold;
        }

        .team-names {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .team-name-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #374151;
            border-radius: 10px;
            background: #1f2937;
            color: white;
            font: inherit;
        }

        .team-name-input::placeholder {
            color: #9ca3af;
        }

        /* TEMPO */

        .times {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .time-option {
            background: #1f2937;
            color: white;
            padding: 15px 5px;
            border-radius: 12px;
            font-weight: bold;
            border: 2px solid transparent;
        }

        .time-option.selected {
            border-color: #ef4444;
        }

        /* =========================
           JOGO
        ========================= */

        #game {
            padding: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-team {
            font-size: 18px;
            font-weight: bold;
        }

        .mute-button {
            background: #1f2937;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
        }

        /* TIMER */

        .timer-container {
            text-align: center;
            margin: 20px 0;
        }

        .timer {
            font-size: 58px;
            font-weight: 900;
        }

        .timer.warning {
            color: #f59e0b;
        }

        .timer.danger {
            color: #ef4444;
        }

        /* CARTA */

        .card {
            background: white;
            color: #111827;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            flex: 1;
            max-height: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            font-size: 13px;
            color: #6b7280;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .word {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .forbidden-title {
            color: #ef4444;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .forbidden {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .forbidden span {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* BOTÕES */

        .game-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .correct,
        .pass {
            padding: 18px;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .correct {
            background: #16a34a;
        }

        .pass {
            background: #374151;
        }

        /* PLACAR */

        .scoreboard {
            margin-top: 15px;
            background: #1f2937;
            border-radius: 14px;
            padding: 10px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 7px;
        }

        .score-row.current {
            color: #f87171;
            font-weight: bold;
        }

        /* =========================
           RESULTADO
        ========================= */

        #result {
            justify-content: center;
            text-align: center;
        }

        .result-title {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .winner {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .final-score {
            background: #1f2937;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

    </style>
</head>

<!-- =========================
     HOME
========================= -->

<div id="home" class="screen active">

        O jogo de palavras proibidas

    <button class="main-button" onclick="showConfig()">
        🎮 NOVA PARTIDA
    </button>

</div>


<!-- =========================
     CONFIGURAÇÃO
========================= -->

<div id="config" class="screen">

            ←
        </button>

        <div class="config-heading">

        </div>

        <div style="width:30px"></div>

    </div>


    <!-- TEMAS -->

    <div class="section">

        <div class="section-title">
            ESCOLHA O TEMA
        </div>

        <div class="themes">

            <button class="theme selected" onclick="selectTheme(this,'Todos')">
                🎲 Todos
            </button>

            <button class="theme" onclick="selectTheme(this,'Música')">
                🎸 Música
            </button>

            <button class="theme" onclick="selectTheme(this,'Ciência')">
                🔬 Ciência
            </button>

            <button class="theme" onclick="selectTheme(this,'Natureza')">
                🌳 Natureza
            </button>

            <button class="theme" onclick="selectTheme(this,'Filmes')">
                🎬 Filmes
            </button>

            <button class="theme" onclick="selectTheme(this,'Esportes')">
                ⚽ Esportes
            </button>

            <button class="theme" onclick="selectTheme(this,'História')">
                📜 História
            </button>

        </div>

    </div>


    <!-- TIMES -->

    <div class="section">

        <div class="section-title">
            TIMES
        </div>

        <div class="team-control">

            <button onclick="changeTeams(-1)">
                −
            </button>

            <div class="team-number">
                <span id="teamCount">2</span>
                times
            </div>

            <button onclick="changeTeams(1)">
                +
            </button>

        </div>

        <div id="teamNames" class="team-names"></div>

    </div>


    <!-- TEMPO -->

    <div class="section">

        <div class="section-title">
            TEMPO POR JOGADA
        </div>

        <div class="times">

            <button class="time-option selected"
                    onclick="selectTime(this,30)">
                30s
            </button>

            <button class="time-option"
                    onclick="selectTime(this,60)">
                60s
            </button>

            <button class="time-option"
                    onclick="selectTime(this,90)">
                90s
            </button>

        </div>

    </div>


    <button class="main-button" onclick="startGame()">
        COMEÇAR!
    </button>

</div>


<!-- =========================
     JOGO
========================= -->

<div id="game" class="screen">

    <div class="game-header">

        <div class="game-brand">
            <img class="brand-logo brand-logo-game" src="logo-nao-pode.png" alt="Não Pode!">
            <div class="turn-team">
                Vez do <span id="currentTeamName">Time 1</span>
            </div>
        </div>

        <button class="mute-button"
                onclick="toggleMute()"
                id="muteButton">
            🔊
        </button>

    </div>


    <!-- TIMER -->

    <div class="timer-container">

        <div id="timer" class="timer">
            30
        </div>

    </div>


    <!-- CARTA -->

    <div class="card">

        <div id="cardCategory" class="category">
            MÚSICA
        </div>

        <div id="cardWord" class="word">
            GUITARRA
        </div>

        <div class="forbidden-title">
            🚫 NÃO PODE FALAR
        </div>

        <div id="forbiddenWords" class="forbidden">
        </div>

    </div>


    <!-- BOTÕES -->

    <div class="game-buttons">

        <button class="correct"
                onclick="correctAnswer()">
            ✓ ACERTOU
        </button>

        <button class="pass"
                onclick="passCard()">
            → PASSOU
        </button>

    </div>


    <!-- PLACAR -->

    <div class="scoreboard"
         id="scoreboard">
    </div>

</div>


<!-- =========================
     RESULTADO
========================= -->

<div id="result" class="screen">

    <img class="brand-logo brand-logo-result" src="logo-nao-pode.png" alt="Não Pode!">

    <div class="result-title">
        🏆 FIM DE JOGO!
    </div>

    <div class="winner" id="winner">
    </div>

    <div id="finalScores">
    </div>

    <button class="main-button"
            onclick="showConfig()">
        JOGAR NOVAMENTE
    </button>

</div>

    "Música": ["canção", "melodia", "som", "artista", "palco", "ouvir", "banda", "ritmo"],
    "Ciência": ["pesquisa", "laboratório", "experimento", "estudo", "teoria", "descoberta", "matéria", "energia"],

};

const normalizeWords = value => value
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("pt-BR")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();

expandedCardGroups.forEach(group => {
    group.words.forEach(word => {
        const answer = ` ${normalizeWords(word)} `;
        const forbidden = [...new Set([
            ...group.forbidden,
            ...fallbackForbiddenByTheme[group.theme]
        ])].filter(term => {
            const normalizedTerm = normalizeWords(term);
            return !answer.includes(` ${normalizedTerm} `);
        }).slice(0, 5);

        cards.push({
            theme: group.theme,
            word,
            forbidden
        });
    });
});


/* ======================================
   VARIÁVEIS
====================================== */

let selectedTheme = "Todos";

let teamCount = 2;

let selectedTime = 30;

let currentTeam = 0;

let teams = [];

let usedCards = [];

let currentCard = null;

let timerInterval = null;

let timeRemaining = 30;

let muted = false;

renderTeamNameInputs();


/* ======================================
   NAVEGAÇÃO
====================================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


function showConfig() {

    showScreen("config");

}


/* ======================================
   TEMAS
====================================== */

function selectTheme(element, theme) {

    document
        .querySelectorAll(".theme")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    element.classList.add("selected");

    selectedTheme = theme;

}


/* ======================================
   TIMES
====================================== */

function changeTeams(value) {

    teamCount += value;

    if (teamCount < 2)
        teamCount = 2;

    if (teamCount > 8)
        teamCount = 8;

    document.getElementById("teamCount").innerText =
        teamCount;

    renderTeamNameInputs();

}


function renderTeamNameInputs() {

    const container = document.getElementById("teamNames");
    const names = Array.from(container.querySelectorAll("input"))
        .map(input => input.value);

    container.innerHTML = "";

    for (let i = 0; i < teamCount; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "team-name-input";
        input.maxLength = 30;
        input.autocomplete = "off";
        input.setAttribute("aria-label", `Nome do time ${i + 1} (opcional)`);
        input.placeholder = `Time ${i + 1} (opcional)`;
        input.value = names[i] || "";
        container.appendChild(input);
    }

}


/* ======================================
   TEMPO
====================================== */

function selectTime(element, time) {

    document
        .querySelectorAll(".time-option")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    element.classList.add("selected");

    selectedTime = time;

}


/* ======================================
   INICIAR JOGO
====================================== */

function startGame() {

    teams = [];

    for (let i = 0; i < teamCount; i++) {

        teams.push({
            name: document.querySelectorAll("#teamNames input")[i].value.trim() || "Time " + (i + 1),
            score: 0
        });

    }

    currentTeam = 0;

    usedCards = [];

    showScreen("game");

    updateScoreboard();

    nextCard();

}


/* ======================================
   SORTEAR CARTA
====================================== */

function nextCard() {

    clearInterval(timerInterval);

    let availableCards = cards.filter(card => {

        let themeMatch =
            selectedTheme === "Todos" ||
            card.theme === selectedTheme;

        let notUsed =
            !usedCards.includes(card);

        return themeMatch && notUsed;

    });


    /*
       Se todas as cartas daquele tema
       já foram utilizadas, encerra o jogo.
    */

    if (availableCards.length === 0) {

        finishGame();

        return;

    }


    let index =
        Math.floor(Math.random() * availableCards.length);

    currentCard = availableCards[index];

    usedCards.push(currentCard);


    document.getElementById("cardCategory")
        .innerText = currentCard.theme;

    document.getElementById("cardWord")
        .innerText = currentCard.word;


    const forbidden =
        document.getElementById("forbiddenWords");

    forbidden.innerHTML = "";


    currentCard.forbidden.forEach(word => {

        let span = document.createElement("span");

        span.innerText = word;

        forbidden.appendChild(span);

    });


    document.getElementById("currentTeamName")
        .innerText =
        teams[currentTeam].name;


    startTimer();

}


/* ======================================
   TIMER
====================================== */

function startTimer() {

    timeRemaining = selectedTime;

    updateTimer();

    timerInterval = setInterval(() => {

        timeRemaining--;

        updateTimer();

        if (timeRemaining <= 0) {

            clearInterval(timerInterval);

            timeUp();

        }

    }, 1000);

}


function updateTimer() {

    const timer =
        document.getElementById("timer");

    timer.innerText =
        timeRemaining;


    timer.classList.remove(
        "warning",
        "danger"
    );


    if (timeRemaining <= 10) {

        timer.classList.add("danger");

    } else if (timeRemaining <= 20) {

        timer.classList.add("warning");

    }

}


/* ======================================
   TEMPO ESGOTADO
====================================== */

function timeUp() {

    playSound();

    alert("⏰ TEMPO ESGOTADO!");

    nextTeam();

}


/* ======================================
   ACERTOU
====================================== */

function correctAnswer() {

    clearInterval(timerInterval);

    teams[currentTeam].score++;

    nextTeam();

}


/* ======================================
   PASSOU
====================================== */

function passCard() {

    clearInterval(timerInterval);

    nextTeam();

}


/* ======================================
   PRÓXIMO TIME
====================================== */

function nextTeam() {

    currentTeam++;

    if (currentTeam >= teams.length) {

        currentTeam = 0;

    }

    updateScoreboard();

    nextCard();

}


/* ======================================
   PLACAR
====================================== */

function updateScoreboard() {

    const scoreboard =
        document.getElementById("scoreboard");

    scoreboard.innerHTML = "";


    teams.forEach((team, index) => {

        const row =
            document.createElement("div");

        row.className =
            "score-row";


        if (index === currentTeam) {

            row.classList.add("current");

        }


        const name = document.createElement("span");
        name.textContent = team.name;
        const score = document.createElement("strong");
        score.textContent = team.score;
        row.append(name, score);


        scoreboard.appendChild(row);

    });

}


/* ======================================
   MUTE
====================================== */

function toggleMute() {

    muted = !muted;

    document.getElementById("muteButton")
        .innerText =
        muted ? "🔇" : "🔊";

}


/* ======================================
   SOM
====================================== */

function playSound() {

    if (muted)
        return;


    /*
       Utiliza a Web Audio API.
       Não precisa de nenhum arquivo externo.
    */

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext)
        return;


    const audio =
        new AudioContext();


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.frequency.value = 700;

    oscillator.type = "square";


    gain.gain.setValueAtTime(
        0.3,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audio.currentTime + 0.5
    );


    oscillator.start();

    oscillator.stop(
        audio.currentTime + 0.5
    );

}


/* ======================================
   FINAL DO JOGO
====================================== */

function finishGame() {

    clearInterval(timerInterval);

    showScreen("result");


    teams.sort(
        (a, b) => b.score - a.score
    );


    const winner =
        document.getElementById("winner");


    winner.innerText =
        "🏆 " +
        teams[0].name +
        " venceu!";


    const finalScores =
        document.getElementById("finalScores");


    finalScores.innerHTML = "";


    teams.forEach((team, index) => {

        const row =
            document.createElement("div");

        row.className =
            "final-score";


        const name = document.createElement("span");
        name.textContent = `${index + 1}º - ${team.name}`;
        const score = document.createElement("strong");
        score.textContent = `${team.score} ponto(s)`;
        row.append(name, score);


        finalScores.appendChild(row);

    });

}

</script>
