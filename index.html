<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Não Pode!</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TELA INICIAL
        ========================= */

        #home {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-logo {
            display: block;
            object-fit: contain;
        }

        .brand-logo-home {
            width: min(82vw, 340px);
            max-height: 32vh;
            margin-bottom: 10px;
        }

        .config-heading {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo-compact {
            width: 48px;
            height: 42px;
        }

        .brand-logo-game {
            width: 58px;
            height: 42px;
            flex: 0 0 auto;
        }

        .brand-logo-result {
            width: min(45vw, 170px);
            max-height: 20vh;
            margin: 0 auto 8px;
        }

        .game-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
        }

        .main-button {
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }

        .main-button:active {
            transform: scale(.97);
        }

        .secondary-button {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #374151;
            border-radius: 14px;
            background: #1f2937;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .room-code {
            margin: 12px 0 20px;
            padding: 18px;
            border: 2px dashed #38bdf8;
            border-radius: 14px;
            color: #7dd3fc;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            text-align: center;
            user-select: all;
        }

        .room-info {
            color: #9ca3af;
            text-align: center;
            margin: 8px 0 16px;
        }

        .room-players {
            display: grid;
            gap: 8px;
            width: 100%;
            margin: 10px 0 18px;
        }

        .room-player {
            padding: 12px 14px;
            border-radius: 10px;
            background: #1f2937;
        }

        .room-error {
            min-height: 22px;
            margin-top: 8px;
            color: #fca5a5;
            font-size: 14px;
            text-align: center;
        }

        .room-code-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #374151;
            border-radius: 10px;
            background: #1f2937;
            color: white;
            font: inherit;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
        }

        .room-only {
            display: none;
        }

        body.room-setup .room-only {
            display: block;
        }

        /* =========================
           CONFIGURAÇÃO
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
        }

        .back-button {
            background: transparent;
            color: white;
            font-size: 28px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            display: block;
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* TIMES */

        .team-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1f2937;
            border-radius: 14px;
            padding: 10px 15px;
        }

        .team-control button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #374151;
            color: white;
            font-size: 25px;
        }

        .team-number {
            font-size: 25px;
            font-weight: bold;
        }

        .team-names {
            display: grid;
            gap: 10px;
            margin-top: 12px;
        }

        .team-name-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #374151;
            border-radius: 10px;
            background: #1f2937;
            color: white;
            font: inherit;
        }

        .team-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-color-preview {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            border: 2px solid rgba(255,255,255,.8);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(255,255,255,.08);
        }

        .team-name-input::placeholder {
            color: #9ca3af;
        }

        .max-score-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #374151;
            border-radius: 10px;
            background: #1f2937;
            color: white;
            font: inherit;
        }

        /* TEMPO */

        .times {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .time-option {
            background: #1f2937;
            color: white;
            padding: 15px 5px;
            border-radius: 12px;
            font-weight: bold;
            border: 2px solid transparent;
        }

        .time-option.selected {
            border-color: #ef4444;
        }

        /* =========================
           JOGO
        ========================= */

        #game {
            padding: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-team {
            max-width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--team-color, #38bdf8);
            border-radius: 14px;
            background: #1f2937;
            color: var(--team-color, #38bdf8);
            font-size: clamp(20px, 5vw, 27px);
            font-weight: 900;
            line-height: 1.15;
            overflow-wrap: anywhere;
            box-shadow: 0 0 16px rgba(255,255,255,.08);
        }

        .mute-button {
            background: #1f2937;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
        }

        /* TIMER */

        .timer-container {
            text-align: center;
            margin: 20px 0;
        }

        .timer {
            font-size: 58px;
            font-weight: 900;
        }

        .timer.warning {
            color: #f59e0b;
        }

        .timer.danger {
            color: #ef4444;
        }

        /* CARTA */

        .card {
            background: white;
            color: #111827;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            flex: 1;
            max-height: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .word {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .forbidden-title {
            color: #ef4444;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .forbidden {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .forbidden span {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* BOTÕES */

        .game-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .correct,
        .pass {
            padding: 18px;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .correct {
            background: #16a34a;
        }

        .pass {
            background: #374151;
        }

        /* PLACAR */

        .scoreboard {
            margin-top: 15px;
            background: #1f2937;
            border-radius: 14px;
            padding: 10px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 7px;
        }

        .score-row.current {
            font-weight: bold;
            background: #111827;
        }

        .score-row span {
            font-weight: bold;
        }

        /* =========================
           RESULTADO
        ========================= */

        #result {
            justify-content: center;
            text-align: center;
        }

        #roundEnd {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .round-message {
            margin: 4px 0 18px;
            color: #d1d5db;
            font-size: 20px;
            font-weight: bold;
        }

        .round-team-name {
            display: inline-block;
            margin-bottom: 12px;
            padding: 10px 16px;
            border: 2px solid;
            border-radius: 12px;
            background: #1f2937;
            font-size: 26px;
            font-weight: 900;
        }

        .round-team-score {
            margin-bottom: 18px;
            color: #d1d5db;
            font-size: 18px;
        }

        .result-title {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .winner {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .final-score {
            background: #1f2937;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

    </style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home" class="screen active">

    <img class="brand-logo brand-logo-home" src="https://jcloreto35.github.io/NaoPodeWeb/logo-nao-pode.png" alt="Não Pode!">

    <div class="subtitle">
        O jogo de palavras proibidas
    </div>

    <button class="main-button" onclick="showConfig()">
        🎮 NOVA PARTIDA
    </button>

    <button class="secondary-button" onclick="configureRoom()">
        🏠 CRIAR SALA
    </button>

    <button class="secondary-button" onclick="showJoinRoom()">
        🔗 CONECTAR A UMA SALA
    </button>

</div>


<!-- =========================
     CONFIGURAÇÃO
========================= -->

<div id="config" class="screen">

    <div class="header">

        <button class="back-button" onclick="showScreen('home')">
            ←
        </button>

        <div class="config-heading">
            <img class="brand-logo brand-logo-compact" src="https://jcloreto35.github.io/NaoPodeWeb/logo-nao-pode.png" alt="">
            <h2>Configurar partida</h2>
        </div>

        <div style="width:30px"></div>

    </div>

    <div class="section room-only">
        <label class="section-title" for="hostPlayerName">SEU NOME NA SALA</label>
        <input id="hostPlayerName" class="team-name-input" type="text" maxlength="24" autocomplete="off" placeholder="Seu nome">
    </div>


    <!-- TIMES -->

    <div class="section">

        <div class="section-title">
            TIMES
        </div>

        <div class="team-control">

            <button onclick="changeTeams(-1)">
                −
            </button>

            <div class="team-number">
                <span id="teamCount">2</span>
                times
            </div>

            <button onclick="changeTeams(1)">
                +
            </button>

        </div>

        <div id="teamNames" class="team-names"></div>

    </div>


    <!-- PONTUAÇÃO MÁXIMA -->

    <div class="section">

        <label class="section-title" for="maxScore">
            PONTUAÇÃO MÁXIMA (OPCIONAL)
        </label>

        <input id="maxScore"
               class="max-score-input"
               type="number"
               min="1"
               step="1"
               inputmode="numeric"
               placeholder="Sem limite de pontos">

    </div>


    <!-- TEMPO -->

    <div class="section">

        <div class="section-title">
            TEMPO POR JOGADA
        </div>

        <div class="times">

            <button class="time-option selected"
                    onclick="selectTime(this,30)">
                30s
            </button>

            <button class="time-option"
                    onclick="selectTime(this,60)">
                60s
            </button>

            <button class="time-option"
                    onclick="selectTime(this,90)">
                90s
            </button>

        </div>

    </div>


    <button id="configStartButton" class="main-button" onclick="startConfiguredGame()">
        COMEÇAR!
    </button>

    <div id="roomSetupError" class="room-error room-only"></div>

</div>


<!-- =========================
     CONECTAR À SALA
========================= -->

<div id="joinRoom" class="screen">
    <div class="header">
        <button class="back-button" onclick="showScreen('home')">←</button>
        <h2>Conectar à sala</h2>
        <div style="width:30px"></div>
    </div>

    <div class="section">
        <label class="section-title" for="joinRoomCode">CÓDIGO DA SALA</label>
        <input id="joinRoomCode" class="room-code-input" type="text" maxlength="5" inputmode="numeric" pattern="[0-9]{5}" autocomplete="off" placeholder="EX: 04217">
    </div>

    <div class="section">
        <label class="section-title" for="joinPlayerName">SEU NOME</label>
        <input id="joinPlayerName" class="team-name-input" type="text" maxlength="24" autocomplete="off" placeholder="Como devemos te chamar?">
    </div>

    <div id="joinRoomError" class="room-error"></div>
    <button class="main-button" onclick="submitJoinRoom()">CONECTAR</button>
</div>


<!-- =========================
     SALA DE ESPERA
========================= -->

<div id="lobby" class="screen">
    <div class="header">
        <button class="back-button" onclick="leaveRoom()">←</button>
        <h2>Sala de espera</h2>
        <div style="width:30px"></div>
    </div>

    <div class="room-info">Compartilhe este código com os outros jogadores</div>
    <div id="lobbyRoomCode" class="room-code"></div>
    <button class="secondary-button" onclick="copyRoomCode()">COPIAR CÓDIGO</button>
    <div class="section-title">JOGADORES NA SALA</div>
    <div id="lobbyPlayers" class="room-players"></div>
    <div id="lobbyStatus" class="room-info">Aguardando o início da partida...</div>
    <div id="lobbyError" class="room-error"></div>
    <button id="startRoomGameButton" class="main-button" onclick="startRoomGame()">INICIAR PARTIDA</button>
</div>


<!-- =========================
     JOGO
========================= -->

<div id="game" class="screen">

    <div class="game-header">

        <div class="game-brand">
            <img class="brand-logo brand-logo-game" src="https://jcloreto35.github.io/NaoPodeWeb/logo-nao-pode.png" alt="Não Pode!">
            <div class="turn-team">
                Vez do <span id="currentTeamName">Time 1</span>
            </div>
        </div>

        <button class="mute-button"
                onclick="toggleMute()"
                id="muteButton">
            🔊
        </button>

    </div>


    <!-- TIMER -->

    <div class="timer-container">

        <div id="timer" class="timer">
            30
        </div>

    </div>


    <!-- CARTA -->

    <div class="card">
<div id="cardWord" class="word">
            GUITARRA
        </div>

        <div class="forbidden-title">
            🚫 NÃO PODE FALAR
        </div>

        <div id="forbiddenWords" class="forbidden">
        </div>

    </div>


    <!-- BOTÕES -->

    <div class="game-buttons">

        <button class="correct"
                onclick="correctAnswer()">
            ✓ ACERTOU
        </button>

        <button class="pass"
                onclick="passCard()">
            → PASSOU
        </button>

    </div>


    <!-- PLACAR -->

    <div class="scoreboard"
         id="scoreboard">
    </div>

</div>


<!-- =========================
     RESULTADO
========================= -->

<div id="result" class="screen">

    <img class="brand-logo brand-logo-result" src="https://jcloreto35.github.io/NaoPodeWeb/logo-nao-pode.png" alt="Não Pode!">

    <div class="result-title">
        🏆 FIM DE JOGO!
    </div>

    <div class="winner" id="winner">
    </div>

    <div id="finalScores">
    </div>

    <button class="main-button"
            onclick="showConfig()">
        JOGAR NOVAMENTE
    </button>

</div>


<!-- =========================
     FIM DA RODADA
========================= -->

<div id="roundEnd" class="screen">

    <img class="brand-logo brand-logo-result" src="https://jcloreto35.github.io/NaoPodeWeb/logo-nao-pode.png" alt="Não Pode!">

    <div class="result-title">RODADA ENCERRADA</div>

    <div class="round-message" id="roundMessage"></div>

    <div class="round-team-name" id="roundTeamName"></div>

    <div class="round-team-score" id="roundTeamScore"></div>

    <button class="main-button" onclick="beginNextRound()">
        PRÓXIMA
    </button>

</div>

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


function showConfig() {

    if (activeRoomRef && activeRoomListener) activeRoomRef.off("value", activeRoomListener);
    activeRoomRef = null;
    activeRoomListener = null;
    activeRoomCode = null;
    onlineRoomData = null;
    onlineGameState = null;
    isRoomHost = false;
    isCreatingRoom = false;
    document.body.classList.remove("room-setup");
    document.getElementById("configStartButton").textContent = "COMEÇAR!";
    document.getElementById("roomSetupError").textContent = "";
    showScreen("config");

}


function configureRoom() {

    isCreatingRoom = true;
    document.body.classList.add("room-setup");
    document.getElementById("configStartButton").textContent = "CRIAR SALA";
    document.getElementById("roomSetupError").textContent = "";
    showScreen("config");

}


function showJoinRoom() {

    document.getElementById("joinRoomError").textContent = "";
    showScreen("joinRoom");

}


function ensureFirebase() {

    if (!firebaseConfig.databaseURL) {
        throw new Error("Crie o Realtime Database no Firebase e informe o databaseURL antes de usar as salas.");
    }

    if (!firebaseApp) {
        if (!window.firebase) {
            throw new Error("Não foi possível carregar o Firebase. Confira sua conexão com a internet.");
        }
        firebaseApp = firebase.initializeApp(firebaseConfig);
        firebaseAuth = firebase.auth();
        firebaseDb = firebase.database();
        firebaseDb.ref(".info/serverTimeOffset").on("value", snapshot => {
            serverTimeOffset = snapshot.val() || 0;
        });
    }

}


async function getRoomUser() {

    ensureFirebase();
    if (!firebaseAuth.currentUser) {
        await firebaseAuth.signInAnonymously();
    }
    playerUid = firebaseAuth.currentUser.uid;
    return playerUid;

}


function makeRoomCode() {

    const randomValues = new Uint32Array(1);
    crypto.getRandomValues(randomValues);
    return String(randomValues[0] % 100000).padStart(5, "0");

}


function showRoomError(elementId, error) {

    const element = document.getElementById(elementId);
    if (!element) return;
    const messages = {
        "auth/operation-not-allowed": "Ative o login anônimo em Authentication no Firebase.",
        "auth/api-key-not-valid": "O Firebase rejeitou a chave da API. Confira se o firebaseConfig foi copiado do app Web correto e se a chave Browser está ativa no projeto.",
        "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "O Firebase rejeitou a chave da API. Confira se o firebaseConfig foi copiado do app Web correto e se a chave Browser está ativa no projeto.",
        "auth/invalid-api-key": "O Firebase rejeitou a chave da API. Confira se o firebaseConfig foi copiado do app Web correto e se a chave Browser está ativa no projeto.",
        "auth/unauthorized-domain": "Este domínio ainda não está autorizado em Authentication → Settings → Authorized domains no Firebase.",
        "database/permission-denied": "O Firebase bloqueou o acesso. Confira as regras de segurança do Realtime Database.",
        "PERMISSION_DENIED": "O Firebase bloqueou o acesso. Confira as regras de segurança do Realtime Database."
    };
    element.textContent = messages[error.code] || error.message || "Não foi possível acessar a sala.";

}


async function copyRoomCode() {

    try {
        await navigator.clipboard.writeText(activeRoomCode || "");
        document.getElementById("lobbyStatus").textContent = "Código copiado. Compartilhe com os outros jogadores.";
    } catch {
        document.getElementById("lobbyStatus").textContent = "Selecione e copie o código da sala acima.";
    }

}


async function startConfiguredGame() {

    if (isCreatingRoom) {
        await createRoom();
    } else {
        startGame();
    }

}


async function createRoom() {

    const errorElement = document.getElementById("roomSetupError");
    errorElement.textContent = "";

    try {
        const hostUid = await getRoomUser();
        const playerName = document.getElementById("hostPlayerName").value.trim() || "Anfitrião";
        const configuredTeams = Array.from(document.querySelectorAll("#teamNames input"), (input, index) => ({
            name: input.value.trim() || `Time ${index + 1}`,
            color: setupTeamColors[index],
            score: 0
        }));
        const scoreLimit = Number(document.getElementById("maxScore").value);
        const initialRoom = {
            hostUid,
            status: "waiting",
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            config: {
                teams: configuredTeams,
                selectedTime,
                maxScore: Number.isInteger(scoreLimit) && scoreLimit > 0 ? scoreLimit : null
            },
            players: { [hostUid]: { name: playerName } },
            game: null
        };

        let roomCode = null;
        for (let attempt = 0; attempt < 12; attempt++) {
            const candidateCode = makeRoomCode();
            const roomRef = firebaseDb.ref(`rooms/${candidateCode}`);
            try {
                const result = await roomRef.transaction(current => current === null ? initialRoom : undefined);
                if (result.committed) {
                    roomCode = candidateCode;
                    break;
                }
            } catch (error) {
                if (error.code !== "PERMISSION_DENIED" && error.code !== "database/permission-denied") {
                    throw error;
                }
            }
        }

        if (!roomCode) {
            throw new Error("Não foi possível gerar um código livre. Confira as regras do banco ou tente novamente.");
        }

        connectToRoom(roomCode, true);
    } catch (error) {
        showRoomError("roomSetupError", error);
        showScreen("config");
    }

}


async function submitJoinRoom() {

    const errorElement = document.getElementById("joinRoomError");
    errorElement.textContent = "";
    const code = document.getElementById("joinRoomCode").value.trim();
    roomPlayerName = document.getElementById("joinPlayerName").value.trim();

    if (!/^\d{5}$/.test(code)) {
        errorElement.textContent = "Digite os 5 números informados pelo anfitrião.";
        return;
    }
    if (!roomPlayerName) {
        errorElement.textContent = "Informe seu nome para entrar na sala.";
        return;
    }

    try {
        const uid = await getRoomUser();
        const roomRef = firebaseDb.ref(`rooms/${code}`);
        const snapshot = await roomRef.once("value");
        const room = snapshot.val();
        if (!room) throw new Error("Sala não encontrada. Confira o código.");
        if (room.status !== "waiting" && !room.players?.[uid]) {
            throw new Error("A partida já começou e a sala não aceita novas conexões.");
        }
        await roomRef.child(`players/${uid}`).set({ name: roomPlayerName });
        connectToRoom(code, uid === room.hostUid);
    } catch (error) {
        showRoomError("joinRoomError", error);
    }

}


function connectToRoom(code, host) {

    if (activeRoomRef && activeRoomListener) {
        activeRoomRef.off("value", activeRoomListener);
    }
    activeRoomCode = code;
    activeRoomRef = firebaseDb.ref(`rooms/${code}`);
    isRoomHost = host;
    document.getElementById("lobbyRoomCode").textContent = code;
    activeRoomListener = snapshot => {
        onlineRoomData = snapshot.val();
        if (!onlineRoomData) {
            showRoomError("lobbyError", new Error("Esta sala não existe mais."));
            showScreen("lobby");
            return;
        }
        isRoomHost = onlineRoomData.hostUid === playerUid;
        renderRoomPlayers(onlineRoomData.players || {});
        document.getElementById("startRoomGameButton").style.display = isRoomHost ? "block" : "none";

        if (onlineRoomData.status === "waiting") {
            document.getElementById("lobbyStatus").textContent = isRoomHost
                ? "Aguardando os jogadores entrarem."
                : "Aguardando o anfitrião iniciar a partida...";
            showScreen("lobby");
            return;
        }

        if (onlineRoomData.status === "playing" && onlineRoomData.game) {
            syncOnlineGame(onlineRoomData);
        }
    };
    activeRoomRef.on("value", activeRoomListener, error => showRoomError("lobbyError", error));
    showScreen("lobby");

}


function renderRoomPlayers(players) {

    const list = document.getElementById("lobbyPlayers");
    list.innerHTML = "";
    Object.entries(players).forEach(([uid, player]) => {
        if (uid === playerUid) {
            const input = document.createElement("input");
            input.className = "team-name-input";
            input.maxLength = 24;
            input.value = player.name || "";
            input.setAttribute("aria-label", "Seu nome na sala");
            input.addEventListener("change", () => {
                const name = input.value.trim().slice(0, 24);
                if (name) activeRoomRef.child(`players/${playerUid}/name`).set(name);
            });
            list.appendChild(input);
        } else {
            const row = document.createElement("div");
            row.className = "room-player";
            row.textContent = player.name || "Jogador";
            list.appendChild(row);
        }
    });

}


function startRoomGame() {

    if (!isRoomHost || !activeRoomRef || !onlineRoomData) return;
    const cardIndex = Math.floor(Math.random() * cards.length);
    const config = onlineRoomData.config;
    const startAt = Date.now() + serverTimeOffset;
    activeRoomRef.update({
        status: "playing",
        game: {
            phase: "playing",
            teams: config.teams,
            selectedTime: config.selectedTime,
            maxScore: config.maxScore,
            currentTeam: 0,
            cardIndex,
            usedCardIndexes: [cardIndex],
            turnEndsAt: startAt + config.selectedTime * 1000,
            roundMessage: ""
        }
    }).catch(error => showRoomError("lobbyError", error));

}


function syncOnlineGame(room) {

    const game = room.game;
    onlineGameState = game;
    teams = game.teams || [];
    currentTeam = game.currentTeam || 0;
    selectedTime = game.selectedTime || 30;
    maxScore = game.maxScore || null;
    usedCards = (game.usedCardIndexes || []).map(index => cards[index]).filter(Boolean);

    if (game.phase === "finished") {
        clearInterval(timerInterval);
        renderFinalResults(game.winnerName);
        showScreen("result");
        return;
    }

    const card = cards[game.cardIndex];
    if (card) {
        document.getElementById("cardWord").textContent = card.word.toLocaleUpperCase("pt-BR");
        const forbidden = document.getElementById("forbiddenWords");
        forbidden.innerHTML = "";
        card.forbidden.forEach(word => {
            const span = document.createElement("span");
            span.textContent = word.toLocaleUpperCase("pt-BR");
            forbidden.appendChild(span);
        });
        document.getElementById("currentTeamName").textContent = teams[currentTeam]?.name || "Time";
        document.querySelector(".turn-team").style.setProperty("--team-color", teams[currentTeam]?.color || "#38bdf8");
    }

    updateScoreboard();
    document.querySelector(".game-buttons").style.display = isRoomHost ? "flex" : "none";
    document.querySelector("#roundEnd .main-button").style.display = isRoomHost ? "block" : "none";

    if (game.phase === "roundEnd") {
        const team = teams[currentTeam];
        document.getElementById("roundMessage").textContent = game.roundMessage || "RODADA ENCERRADA";
        const teamName = document.getElementById("roundTeamName");
        teamName.textContent = team?.name || "";
        teamName.style.color = team?.color || "white";
        teamName.style.borderColor = team?.color || "white";
        document.getElementById("roundTeamScore").textContent = `Pontuação do time: ${team?.score || 0}`;
        showScreen("roundEnd");
        clearInterval(timerInterval);
        return;
    }

    showScreen("game");
    roomTimerStartedAt = game.turnEndsAt;
    startTimer();

}


function leaveRoom() {

    if (activeRoomRef && activeRoomListener) activeRoomRef.off("value", activeRoomListener);
    activeRoomCode = null;
    activeRoomRef = null;
    activeRoomListener = null;
    onlineRoomData = null;
    onlineGameState = null;
    isRoomHost = false;
    showScreen("home");

}
/* ======================================
   TIMES
====================================== */

function changeTeams(value) {

    teamCount += value;

    if (teamCount < 2)
        teamCount = 2;

    if (teamCount > 8)
        teamCount = 8;

    document.getElementById("teamCount").innerText =
        teamCount;

    renderTeamNameInputs();

}


function renderTeamNameInputs() {

    const container = document.getElementById("teamNames");
    const names = Array.from(container.querySelectorAll("input"))
        .map(input => input.value);

    container.innerHTML = "";

    while (setupTeamColors.length < teamCount) {
        const remainingColors = teamColorPalette.filter(color => !setupTeamColors.includes(color));
        setupTeamColors.push(remainingColors[Math.floor(Math.random() * remainingColors.length)]);
    }
    setupTeamColors = setupTeamColors.slice(0, teamCount);

    for (let i = 0; i < teamCount; i++) {
        const row = document.createElement("div");
        row.className = "team-name-row";

        const preview = document.createElement("span");
        preview.className = "team-color-preview";
        preview.style.backgroundColor = setupTeamColors[i];
        preview.setAttribute("role", "img");
        preview.setAttribute("aria-label", `Cor do time ${i + 1}`);
        preview.title = `Cor do time ${i + 1}`;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "team-name-input";
        input.maxLength = 30;
        input.autocomplete = "off";
        input.setAttribute("aria-label", `Nome do time ${i + 1} (opcional)`);
        input.placeholder = `Time ${i + 1} (opcional)`;
        input.value = names[i] || "";
        row.append(preview, input);
        container.appendChild(row);
    }

}


/* ======================================
   TEMPO
====================================== */

function selectTime(element, time) {

    document
        .querySelectorAll(".time-option")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    element.classList.add("selected");

    selectedTime = time;

}


/* ======================================
   INICIAR JOGO
====================================== */

function startGame() {

    teams = [];

    const scoreInput = document.getElementById("maxScore");
    const scoreLimit = Number(scoreInput.value);
    maxScore = Number.isInteger(scoreLimit) && scoreLimit > 0 ? scoreLimit : null;

    const teamColors = setupTeamColors.slice(0, teamCount);

    for (let i = 0; i < teamCount; i++) {

        teams.push({
            name: document.querySelectorAll("#teamNames input")[i].value.trim() || "Time " + (i + 1),
            color: teamColors[i],
            score: 0
        });

    }

    currentTeam = 0;

    usedCards = [];

    showScreen("game");

    updateScoreboard();

    nextCard();

}


function startTimer() {

    clearInterval(timerInterval);

    if (activeRoomCode && onlineGameState) {
        const updateOnlineTimer = () => {
            timeRemaining = Math.max(0, Math.ceil((roomTimerStartedAt - (Date.now() + serverTimeOffset)) / 1000));
            updateTimer();
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                if (isRoomHost && !endingOnlineRound) timeUp();
            }
        };
        updateOnlineTimer();
        timerInterval = setInterval(updateOnlineTimer, 200);
        return;
    }

    timeRemaining = selectedTime;
    updateTimer();
    timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimer();
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            timeUp();
        }
    }, 1000);

}


function getRandomTeamColors(count) {

    const colors = [...teamColorPalette];

    for (let i = colors.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[randomIndex]] = [colors[randomIndex], colors[i]];
    }

    return colors.slice(0, count);

}


/* ======================================
   SORTEAR CARTA
====================================== */

function nextCard() {

    clearInterval(timerInterval);

    let availableCards = cards.filter(card => !usedCards.includes(card));


    /*
       Quando todas as cartas já foram utilizadas,
       encerra o jogo.
    */

    if (availableCards.length === 0) {

        finishGame();

        return;

    }


    let index =
        Math.floor(Math.random() * availableCards.length);

    currentCard = availableCards[index];

    usedCards.push(currentCard);
    document.getElementById("cardWord")
        .innerText = currentCard.word.toLocaleUpperCase("pt-BR");


    const forbidden =
        document.getElementById("forbiddenWords");

    forbidden.innerHTML = "";


    currentCard.forbidden.forEach(word => {

        let span = document.createElement("span");

        span.innerText = word.toLocaleUpperCase("pt-BR");

        forbidden.appendChild(span);

    });


    document.getElementById("currentTeamName")
        .innerText = teams[currentTeam].name;

    document.querySelector(".turn-team")
        .style.setProperty("--team-color", teams[currentTeam].color);


    startTimer();

}


/* ======================================
   TIMER
====================================== */

function updateTimer() {

    const timer =
        document.getElementById("timer");

    timer.innerText =
        timeRemaining;


    timer.classList.remove(
        "warning",
        "danger"
    );


    if (timeRemaining <= 10) {

        timer.classList.add("danger");

    } else if (timeRemaining <= 20) {

        timer.classList.add("warning");

    }

}


/* ======================================
   TEMPO ESGOTADO
====================================== */

function timeUp() {

    if (activeRoomCode && !isRoomHost) return;

    playSound();

    endRound("⏰ O TEMPO ACABOU!");

}


/* ======================================
   ACERTOU
====================================== */

function correctAnswer() {

    if (activeRoomCode && !isRoomHost) return;
    clearInterval(timerInterval);

    teams[currentTeam].score++;

    if (maxScore !== null && teams[currentTeam].score >= maxScore) {
        finishGame(teams[currentTeam].name);
        return;
    }

    endRound("✓ RESPOSTA CERTA! +1 PONTO");

}


/* ======================================
   PASSOU
====================================== */

function passCard() {

    if (activeRoomCode && !isRoomHost) return;
    clearInterval(timerInterval);

    endRound("→ CARTA PASSADA");

}


/* ======================================
   PRÓXIMO TIME
====================================== */

function endRound(message) {

    clearInterval(timerInterval);

    const team = teams[currentTeam];

    if (activeRoomCode) {
        if (!isRoomHost || endingOnlineRound) return;
        endingOnlineRound = true;
        activeRoomRef.child("game").update({
            phase: "roundEnd",
            teams,
            roundMessage: message,
            turnEndsAt: null
        }).then(() => {
            endingOnlineRound = false;
        }).catch(error => {
            endingOnlineRound = false;
            showRoomError("lobbyError", error);
        });
        return;
    }

    document.getElementById("roundMessage").textContent = message;

    const teamName = document.getElementById("roundTeamName");
    teamName.textContent = team.name;
    teamName.style.color = team.color;
    teamName.style.borderColor = team.color;

    document.getElementById("roundTeamScore").textContent =
        `Pontuação do time: ${team.score}`;

    updateScoreboard();
    showScreen("roundEnd");

}


function beginNextRound() {

    if (activeRoomCode) {
        if (!isRoomHost || onlineGameState?.phase !== "roundEnd") return;
        const alreadyUsed = onlineGameState.usedCardIndexes || [];
        const availableIndexes = cards.map((_, index) => index).filter(index => !alreadyUsed.includes(index));
        if (!availableIndexes.length) {
            finishGame();
            return;
        }
        const cardIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
        const nextTeam = (currentTeam + 1) % teams.length;
        const nextTime = Date.now() + serverTimeOffset + selectedTime * 1000;
        activeRoomRef.child("game").update({
            phase: "playing",
            currentTeam: nextTeam,
            cardIndex,
            usedCardIndexes: [...alreadyUsed, cardIndex],
            turnEndsAt: nextTime,
            roundMessage: ""
        }).catch(error => showRoomError("lobbyError", error));
        return;
    }

    currentTeam++;

    if (currentTeam >= teams.length) {

        currentTeam = 0;

    }

    updateScoreboard();

    showScreen("game");

    nextCard();

}


/* ======================================
   PLACAR
====================================== */

function updateScoreboard() {

    const scoreboard =
        document.getElementById("scoreboard");

    scoreboard.innerHTML = "";


    teams.forEach((team, index) => {

        const row =
            document.createElement("div");

        row.className =
            "score-row";

        row.style.borderLeft = `4px solid ${team.color}`;
        row.style.paddingLeft = "10px";


        if (index === currentTeam) {

            row.classList.add("current");

        }


        const name = document.createElement("span");
        name.textContent = team.name;
        name.style.color = team.color;
        const score = document.createElement("strong");
        score.textContent = team.score;
        row.append(name, score);


        scoreboard.appendChild(row);

    });

}


/* ======================================
   MUTE
====================================== */

function toggleMute() {

    muted = !muted;

    document.getElementById("muteButton")
        .innerText =
        muted ? "🔇" : "🔊";

}


/* ======================================
   SOM
====================================== */

function playSound() {

    if (muted)
        return;


    /*
       Utiliza a Web Audio API.
       Não precisa de nenhum arquivo externo.
    */

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext)
        return;


    const audio =
        new AudioContext();


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.frequency.value = 700;

    oscillator.type = "square";


    gain.gain.setValueAtTime(
        0.3,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audio.currentTime + 0.5
    );


    oscillator.start();

    oscillator.stop(
        audio.currentTime + 0.5
    );

}


/* ======================================
   FINAL DO JOGO
====================================== */

function finishGame(winnerName = null) {

    clearInterval(timerInterval);

    if (activeRoomCode) {
        if (!isRoomHost) return;
        const winningTeam = winnerName || [...teams].sort((a, b) => b.score - a.score)[0]?.name;
        activeRoomRef.child("game").update({
            phase: "finished",
            teams,
            winnerName: winningTeam,
            turnEndsAt: null
        }).catch(error => showRoomError("lobbyError", error));
        return;
    }

    showScreen("result");

    renderFinalResults(winnerName);

}


function renderFinalResults(winnerName = null) {


    teams.sort(
        (a, b) => b.score - a.score
    );


    const winner =
        document.getElementById("winner");


    winner.innerText =
        "🏆 " +
        (winnerName || teams[0].name) +
        " venceu!";


    const finalScores =
        document.getElementById("finalScores");


    finalScores.innerHTML = "";


    teams.forEach((team, index) => {

        const row =
            document.createElement("div");

        row.className =
            "final-score";

        row.style.borderLeft = `4px solid ${team.color}`;


        const name = document.createElement("span");
        name.textContent = `${index + 1}º - ${team.name}`;
        name.style.color = team.color;
        const score = document.createElement("strong");
        score.textContent = `${team.score} ponto(s)`;
        row.append(name, score);


        finalScores.appendChild(row);

    });

}
